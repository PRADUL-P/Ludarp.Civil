<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludarp Civil Studio — AutoCAD Shorts & Tips</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --bg-primary: #0a0d14;
      --bg-secondary: #121722;
      --bg-tertiary: #1a2233;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --border: #26334d;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
    }
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
    }
    /* Navigation Bar */
    .pub-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 13, 20, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pub-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-primary);
    }
    .pub-brand-logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.1rem;
      box-shadow: 0 0 15px var(--accent-glow);
    }
    .pub-nav {
      display: flex;
      gap: 8px;
    }
    .pub-nav-btn {
      padding: 8px 16px;
      border-radius: 20px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .pub-nav-btn:hover, .pub-nav-btn.active {
      background: var(--bg-tertiary);
      border-color: var(--border);
      color: var(--accent);
    }
    /* Profile Banner */
    .profile-hero {
      max-width: 935px;
      margin: 30px auto;
      padding: 0 20px;
      display: flex;
      gap: 40px;
      align-items: center;
    }
    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      padding: 4px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
    }
    .profile-avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
    }
    .profile-info {
      flex: 1;
    }
    .profile-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin: 0 0 6px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .profile-verified {
      color: #38bdf8;
      font-size: 1.2rem;
    }
    .profile-stats {
      display: flex;
      gap: 24px;
      margin: 12px 0;
      font-size: 0.9rem;
    }
    .profile-stats span {
      color: var(--text-muted);
    }
    .profile-stats strong {
      color: var(--text-primary);
      font-weight: 700;
    }
    .profile-bio {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Instagram Grid */
    .insta-grid-container {
      max-width: 935px;
      margin: 20px auto 60px auto;
      padding: 0 20px;
    }
    .grid-tabs {
      display: flex;
      justify-content: center;
      gap: 40px;
      border-top: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .grid-tab-btn {
      padding: 12px 0;
      background: transparent;
      border: none;
      border-top: 2px solid transparent;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .grid-tab-btn.active {
      color: var(--text-primary);
      border-top-color: var(--accent);
    }

    .insta-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    @media (max-width: 768px) {
      .insta-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .profile-hero { flex-direction: column; text-align: center; gap: 16px; }
    }
    .insta-card {
      aspect-ratio: 1 / 1;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: transform 0.25s, box-shadow 0.25s;
    }
    .insta-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border-color: var(--accent);
    }
    .insta-card-content {
      padding: 20px;
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: radial-gradient(circle at top right, rgba(56,189,248,0.1), transparent 60%);
    }
    .insta-card-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--accent);
      background: var(--bg-tertiary);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      width: fit-content;
    }
    .insta-card-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-primary);
      margin: 10px 0 6px 0;
      line-height: 1.3;
    }
    .insta-card-desc {
      font-size: 0.78rem;
      color: var(--text-secondary);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Detail Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 16px; right: 16px;
      background: none; border: none;
      color: var(--text-muted);
      font-size: 1.5rem; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header class="pub-header">
    <a href="#" class="pub-brand">
      <div class="pub-brand-logo">📐</div>
      <div>
        <div style="font-weight: 800; font-size: 0.95rem;">Ludarp Civil Studio</div>
        <div style="font-size: 0.72rem; color: var(--text-muted);">AutoCAD Shorts & Quick Tips</div>
      </div>
    </a>

    <nav class="pub-nav">
      <a href="#" class="pub-nav-btn active">📸 Feed Grid</a>
      <a href="index.html" class="pub-nav-btn" style="border-color: var(--accent); color: var(--accent);">⚙️ Open Admin Dashboard</a>
    </nav>
  </header>

  <!-- Profile Hero Banner -->
  <section class="profile-hero">
    <div class="profile-avatar">
      <div class="profile-avatar-inner">📐</div>
    </div>
    <div class="profile-info">
      <h1 class="profile-title">
        ludarp.civil
        <span class="profile-verified">✓</span>
      </h1>
      <div class="profile-stats">
        <div><strong id="pub-published-count">0</strong> <span>Published Posts</span></div>
        <div><strong id="pub-total-shortcuts">141</strong> <span>Shortcuts Loaded</span></div>
        <div><strong>AutoCAD</strong> <span>2D & 3D Mastery</span></div>
      </div>
      <div class="profile-bio">
        🚀 Daily AutoCAD shortcuts, tips, and workflow hacks for civil engineers & draftsmen.<br>
        💡 Master CAD in bite-sized visual steps.
      </div>
    </div>
  </section>

  <!-- Instagram Feed Grid View -->
  <main class="insta-grid-container">
    <div class="grid-tabs">
      <button class="grid-tab-btn active">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        PUBLISHED INSTAGRAM POSTS
      </button>
    </div>

    <div class="insta-grid" id="pub-posts-grid">
      <!-- Dynamically populated published posts -->
    </div>
  </main>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="post-detail-modal" style="display: none;">
    <div class="modal-card" id="modal-card-content">
      <button class="modal-close" id="modal-close-btn">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="calendar_data.js"></script>
  <script>
    let calendarDb = JSON.parse(localStorage.getItem('ludarp_calendar_db')) || [];
    if (!calendarDb.length && typeof autocadCalendar !== 'undefined') {
      calendarDb = autocadCalendar;
    }
    const completedDays = new Set(JSON.parse(localStorage.getItem('ludarp_completed_calendar')) || []);

    const publishedPosts = calendarDb.filter(post => post.posted || completedDays.has(String(post.day)));
    const pubCountEl = document.getElementById('pub-published-count');
    if (pubCountEl) pubCountEl.textContent = publishedPosts.length;

    const gridEl = document.getElementById('pub-posts-grid');

    function renderPublicGrid() {
      gridEl.innerHTML = '';
      const displayPosts = publishedPosts.length > 0 ? publishedPosts : calendarDb.slice(0, 12);

      displayPosts.forEach(post => {
        const card = document.createElement('div');
        card.className = 'insta-card';
        const shortcutKey = post.shortcut || post.keys || 'CAD';
        const title = post.action || (post.title ? post.title.replace(/^[^:]+:\s*/, '') : 'Shortcut');
        const desc = post.description || post.desc || (post.bullets ? post.bullets.join(' ') : '');

        card.innerHTML = `
          <div class="insta-card-content">
            <div>
              <span class="insta-card-badge">${shortcutKey}</span>
              <h3 class="insta-card-title">${title}</h3>
              <p class="insta-card-desc">${desc}</p>
            </div>
            <div style="font-size:0.72rem; color:var(--text-muted); font-weight:700;">
              Day ${post.day} • ${post.category || 'AutoCAD'}
            </div>
          </div>
        `;

        card.onclick = () => openPostModal(post);
        gridEl.appendChild(card);
      });
    }

    function openPostModal(post) {
      const modal = document.getElementById('post-detail-modal');
      const body = document.getElementById('modal-body');
      const shortcutKey = post.shortcut || post.keys || 'CAD';
      const title = post.action || (post.title ? post.title.replace(/^[^:]+:\s*/, '') : 'Shortcut');
      const desc = post.description || post.desc || '';
      const steps = post.steps || post.bullets || [];

      let stepsHtml = steps.map(s => `<li style="margin-bottom:6px;">${s}</li>`).join('');

      body.innerHTML = `
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
          <span style="font-family:'JetBrains Mono',monospace; font-size:0.9rem; font-weight:800; color:var(--accent); background:var(--bg-tertiary); padding:4px 10px; border-radius:6px; border:1px solid var(--border);">${shortcutKey}</span>
          <h2 style="margin:0; font-size:1.3rem;">${title}</h2>
        </div>
        <p style="color:var(--text-secondary); line-height:1.5;">${desc}</p>
        ${steps.length > 0 ? `<h4 style="margin-top:16px; color:var(--accent);">Steps to Execute:</h4><ol style="padding-left:20px; color:var(--text-primary); line-height:1.6;">${stepsHtml}</ol>` : ''}
        ${post.proTip ? `<div style="background:var(--bg-tertiary); padding:12px; border-left:3px solid #f59e0b; border-radius:6px; margin-top:16px; font-size:0.85rem; color:#fde68a;"><strong>💡 Pro Tip:</strong> ${post.proTip}</div>` : ''}
      `;

      modal.style.display = 'flex';
    }

    document.getElementById('modal-close-btn').onclick = () => {
      document.getElementById('post-detail-modal').style.display = 'none';
    };

    renderPublicGrid();
  </script>
</body>
</html>
